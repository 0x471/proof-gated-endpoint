6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">12.5</text><text x="380.0" y="376.0" font-size="11" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">seconds after the pair was admitted</text><circle cx="26" cy="392" r="4" fill="white" stroke="#1b1b1b"/><text x="40.0" y="396.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">answer arrives (valid proof)</text><rect x="223.6" y="388" width="14" height="8" fill="#2f6f4f" fill-opacity="0.85"/><text x="243.6" y="396.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">check that passed</text><rect x="359.0" y="388" width="14" height="8" fill="#b3122e" fill-opacity="0.35"/><text x="379.0" y="396.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">check killed at the deadline</text><line x1="568.6" y1="384" x2="568.6" y2="400" stroke="#1b1b1b" stroke-width="2"/><text x="582.6" y="396.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">release time: admission + deadline</text><text x="20.0" y="418.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">The grey band is each request&#x27;s wait from admission to release. One checker takes answers in arrival order.</text></svg>
