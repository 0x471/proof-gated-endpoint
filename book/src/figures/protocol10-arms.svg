<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 302" style="max-width: 820px; background-color: white;" role="img"><rect width="820" height="302" fill="white"/><text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#1b1b1b" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Protocol 10: what happened to every reply, per arm</text><text x="212.0" y="65.0" font-size="12" text-anchor="end" fill="#1b1b1b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Order code, batches of 3, D 20</text><rect x="220.0" y="50" width="380.0" height="22" fill="#2f6f4f" fill-opacity="0.8"/><text x="410.0" y="65.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">192</text><text x="610.0" y="65.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">0 of 64 batches out of order</text><text x="212.0" y="105.0" font-size="12" text-anchor="end" fill="#1b1b1b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Order to failure, D 7.5</text><rect x="220.0" y="90" width="190.0" height="22" fill="#2f6f4f" fill-opacity="0.8"/><text x="315.0" y="105.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">128</text><rect x="410.0" y="90" width="190.0" height="22" fill="#b3122e" fill-opacity="0.8"/><text x="505.0" y="105.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">128</text><text x="610.0" y="105.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">128 of 128 bits read</text><text x="212.0" y="145.0" font-size="12" text-anchor="end" fill="#1b1b1b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Same code, D 12 (control)</text><rect x="220.0" y="130" width="380.0" height="22" fill="#2f6f4f" fill-opacity="0.8"/><text x="410.0" y="145.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">256</text><text x="610.0" y="145.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">no failures, nothing to read</text><text x="212.0" y="185.0" font-size="12" text-anchor="end" fill="#1b1b1b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">D 7.5 with the cap</text><rect x="220.0" y="170" width="80.2" height="22" fill="#2f6f4f" fill-opacity="0.8"/><text x="260.1" y="185.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">54</text><rect x="300.2" y="170" width="84.6" height="22" fill="#b3122e" fill-opacity="0.8"/><text x="342.5" y="185.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">57</text><rect x="384.8" y="170" width="215.2" height="22" fill="#d9822b" fill-opacity="0.8"/><text x="492.4" y="185.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">145</text><text x="610.0" y="185.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">54 of 128 bits read, 74 erased</text><text x="212.0" y="225.0" font-size="12" text-anchor="end" fill="#1b1b1b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Honest pairs, one pending</text><rect x="220.0" y="210" width="190.0" height="22" fill="#2f6f4f" fill-opacity="0.8"/><text x="315.0" y="225.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">128</text><rect x="410.0" y="210" width="190.0" height="22" fill="#7a7a7a" fill-opacity="0.8"/><text x="505.0" y="225.0" font-size="11" text-anchor="middle" fill="white" font-weight="bold" font-family="Helvetica, Arial, sans-serif">128</text><text x="610.0" y="225.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">no bits planted</text><rect x="220" y="254" width="12" height="12" fill="#2f6f4f" fill-opacity="0.8"/><text x="236.0" y="264.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">ok</text><rect x="260.4" y="254" width="12" height="12" fill="#b3122e" fill-opacity="0.8"/><text x="276.4" y="264.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">deadline</text><rect x="338.0" y="254" width="12" height="12" fill="#d9822b" fill-opacity="0.8"/><text x="354.0" y="264.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">capped by the cap</text><rect x="471.4" y="254" width="12" height="12" fill="#7a7a7a" fill-opacity="0.8"/><text x="487.4" y="264.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">busy (turned away)</text><text x="20.0" y="288.0" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Bars show each arm&#x27;s replies as fractions; numbers are counts. D is the deadline in seconds; the cap is W 8, F 2, C 8.</text></svg>
